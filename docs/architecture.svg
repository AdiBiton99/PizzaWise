<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
  <title id="title">PizzaWise architecture</title>
  <desc id="desc">User to web application to backend API over REST /api. The API splits into application services with MySQL, a comparison engine with the Pizzeria API, and a location service with Geoapify. Web, API, and MySQL are on Railway. The Pizzeria API and Geoapify are external.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2.2 L 10 5 L 0 7.8 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#f7f8fa"/>

  <!-- User / Browser -->
  <rect x="450" y="20" width="300" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">User / Browser</text>

  <line x1="600" y1="70" x2="600" y2="96" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Web Application -->
  <rect x="360" y="100" width="480" height="76" rx="6" fill="#e8eef5" stroke="#4b6480" stroke-width="1.5"/>
  <text x="816" y="120" text-anchor="end" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.12em">RAILWAY</text>
  <text x="600" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a4c">Web Application</text>
  <text x="600" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#475569">React · TypeScript · Vite</text>

  <line x1="600" y1="176" x2="600" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="538" y="184" width="124" height="24" rx="4" fill="#f7f8fa" stroke="#64748b" stroke-width="1"/>
  <text x="600" y="201" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">REST /api</text>

  <!-- Backend API -->
  <rect x="360" y="224" width="480" height="76" rx="6" fill="#e8eef5" stroke="#4b6480" stroke-width="1.5"/>
  <text x="816" y="244" text-anchor="end" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.12em">RAILWAY</text>
  <text x="600" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a4c">Backend API</text>
  <text x="600" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#475569">Fastify · TypeScript · Zod · Pino</text>

  <!-- Split -->
  <line x1="600" y1="300" x2="600" y2="324" stroke="#334155" stroke-width="1.5"/>
  <line x1="212" y1="324" x2="988" y2="324" stroke="#334155" stroke-width="1.5"/>
  <line x1="212" y1="324" x2="212" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="324" x2="600" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="988" y1="324" x2="988" y2="348" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Application Services -->
  <rect x="40" y="352" width="344" height="208" rx="6" fill="#eef1f4" stroke="#64748b" stroke-width="1.5"/>
  <text x="212" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Application Services</text>
  <text x="212" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Auth</text>
  <text x="212" y="444" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Profiles</text>
  <text x="212" y="470" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Favorites</text>
  <text x="212" y="496" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Orders</text>

  <!-- Comparison Engine -->
  <rect x="428" y="352" width="344" height="208" rx="6" fill="#d7ebe7" stroke="#1f6b63" stroke-width="2"/>
  <text x="600" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#123d39">Comparison Engine</text>
  <text x="600" y="394" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Pizza Configuration</text>
  <line x1="600" y1="400" x2="600" y2="412" stroke="#1f6b63" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="600" y="426" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Nearby Pizzerias</text>
  <line x1="600" y1="432" x2="600" y2="444" stroke="#1f6b63" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="600" y="458" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Menu Cache</text>
  <line x1="600" y1="464" x2="600" y2="476" stroke="#1f6b63" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="600" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Normalize</text>
  <line x1="600" y1="496" x2="600" y2="508" stroke="#1f6b63" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="600" y="522" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Match &amp; Price</text>
  <line x1="600" y1="528" x2="600" y2="538" stroke="#1f6b63" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="600" y="548" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#134e4a">Rank</text>

  <!-- Location Service -->
  <rect x="816" y="352" width="344" height="208" rx="6" fill="#eef1f4" stroke="#64748b" stroke-width="1.5"/>
  <text x="988" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Location Service</text>
  <text x="988" y="456" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Geocoding</text>

  <!-- Domain to infrastructure -->
  <line x1="212" y1="560" x2="212" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="560" x2="600" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="988" y1="560" x2="988" y2="584" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- MySQL -->
  <rect x="40" y="588" width="344" height="76" rx="6" fill="#e8eef5" stroke="#4b6480" stroke-width="1.5"/>
  <text x="360" y="608" text-anchor="end" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.12em">RAILWAY</text>
  <text x="212" y="626" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a4c">MySQL</text>
  <text x="212" y="648" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#475569">Drizzle</text>

  <!-- Pizzeria API -->
  <rect x="428" y="588" width="344" height="76" rx="6" fill="#f3eee6" stroke="#7a6b58" stroke-width="1.5"/>
  <text x="748" y="608" text-anchor="end" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a7e70" letter-spacing="0.12em">EXTERNAL</text>
  <text x="600" y="636" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f3a32">Pizzeria API</text>

  <!-- Geoapify -->
  <rect x="816" y="588" width="344" height="76" rx="6" fill="#f3eee6" stroke="#7a6b58" stroke-width="1.5"/>
  <text x="1136" y="608" text-anchor="end" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8a7e70" letter-spacing="0.12em">EXTERNAL</text>
  <text x="988" y="636" text-anchor="middle" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#3f3a32">Geoapify</text>
</svg>
